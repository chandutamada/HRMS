version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: hrms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-hrms_db}
      MYSQL_USER: ${DB_USER:-hrms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hrms_password}
    # MySQL internal only - bind to 127.0.0.1 for local admin/backups or keep on internal network
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - hrms-network

  api:
    build:
      context: ./Web_App
      dockerfile: apps/api/Dockerfile
    container_name: hrms-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "mysql://${DB_USER:-hrms_user}:${DB_PASSWORD:-hrms_password}@mysql:3306/${DB_NAME:-hrms_db}?connection_limit=30&pool_timeout=30"
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-hrms-2026}
      JWT_EXPIRES_IN: "7d"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STRICT_GEOFENCE: ${STRICT_GEOFENCE:-true}
    # Bound to 127.0.0.1 so only host Nginx reverse proxy can reach it
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hrms-network

  web:
    build:
      context: ./Web_App
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://hrms.superbeeaeronautics.com/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://hrms.superbeeaeronautics.com}
    container_name: hrms-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://hrms.superbeeaeronautics.com/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://hrms.superbeeaeronautics.com}
    # Bound to 127.0.0.1 so only host Nginx reverse proxy can reach it
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - hrms-network

volumes:
  mysql_data:
  api_uploads:

networks:
  hrms-network:
    driver: bridge

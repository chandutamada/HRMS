# ==============================================================================
# SELF-HOSTED PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Canonical Domain: fieldtracking.gramtarang.org
#   - /            -> Next.js Web Portal Dashboard (Port 3001)
#   - /api/        -> NestJS REST API (Port 3000)
#   - /socket.io/  -> NestJS WebSockets / Real-Time Tracking Streams (Port 3000)
# ==============================================================================

# Upstream Service Definitions
upstream hrms_api_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream hrms_web_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Global Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fieldtracking.gramtarang.org;

    # Let's Encrypt ACME Challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Canonical HTTPS Unified Server (fieldtracking.gramtarang.org)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fieldtracking.gramtarang.org;

    # SSL Certificates (managed via Certbot / Let's Encrypt or custom SSL)
    ssl_certificate /etc/letsencrypt/live/fieldtracking.gramtarang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fieldtracking.gramtarang.org/privkey.pem;

    # Modern SSL Protocol & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Allow up to 50MB for employee photos, face verification & avatar uploads
    client_max_body_size 50M;

    # Path /socket.io/ & /ws - WebSocket Upgrade for Real-Time Tracking Streams
    location ~* ^/(socket.io|ws|tracking)/ {
        proxy_pass http://hrms_api_backend;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive and prevent premature socket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Path /api/ - NestJS REST API
    location /api/ {
        proxy_pass http://hrms_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Static uploads (profile avatars, payslips, circular docs)
    location /uploads/ {
        alias /var/www/fieldtracking/Web_App/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Path / - Next.js Standalone Web Application
    location / {
        proxy_pass http://hrms_web_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

# ==============================================================================
# HRMS TRACKING MICROSERVICE - SPRING BOOT CONFIGURATION
# ==============================================================================

server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${DATABASE_URL_JDBC:jdbc:mysql://localhost:3306/hrms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:Chanduu@444444}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Standard physical naming to preserve exact camelCase column names in MySQL tables (e.g. userId, sessionId, distanceKm)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Security Configuration (matches root HRMS ecosystem)
security.jwt.secret=${JWT_SECRET:super_secret_hrms_jwt_access_key_2026_superbee_gtids_gtib!}
security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Geofence & Office Working Hours (Asia/Kolkata 09:00 - 17:30)
hrms.tracking.office-hours.start=09:00
hrms.tracking.office-hours.end=17:30
hrms.tracking.default-geofence-radius-meters=50

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:4000,http://10.0.2.2:4000,http://10.0.2.2:8080,http://localhost:8080

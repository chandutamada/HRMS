name: mobile
description: "HRMS Enterprise Employee Mobile Application with Google Maps Geofenced Attendance"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5
  permission_handler: ^11.3.1
  image_picker: ^1.2.4
  local_auth: ^2.3.0
  battery_plus: ^6.2.1
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
